<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMCA — Yakultind</title>
<meta name="description" content="Kebijakan DMCA dan prosedur pengaduan hak cipta Yakultind.">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-top">
    <a href="index.html" class="home-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Home
    </a>
    <a href="index.html" class="logo">Yakult<em>ind</em></a>
    <button type="button" class="icon-round" id="search-toggle" aria-label="Pencarian" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
  </div>
  <div class="search-panel" id="search-panel">
    <form id="global-search-form">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="global-search-input" type="text" placeholder="Pencarian..." autocomplete="off">
    </form>
  </div>
  <div class="bar-slots" id="bar-slots"></div>
</header>

<div class="nav-row" id="nav-row"></div>

<main class="static-page">
  <h1>DMCA</h1>
  <div class="content" id="page-content"><div class="skel-line w1" style="height:15px;"></div><div class="skel-line" style="margin:14px 0;"></div><div class="skel-line w2" style="margin-left:0;"></div></div>
</main>

<div id="site-footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="search-suggest.js"></script>
<script>
  const DEFAULT_DMCA = `Yakultind menghormati hak kekayaan intelektual pihak lain dan akan menanggapi laporan pelanggaran hak cipta yang sah sesuai prosedur DMCA (Digital Millennium Copyright Act) atau ketentuan serupa yang berlaku.

Jika kamu merasa ada konten di situs ini yang melanggar hak cipta milikmu, kirimkan laporan resmi yang mencantumkan:

1. Identifikasi karya berhak cipta yang diklaim dilanggar.
2. URL atau lokasi pasti konten yang dilaporkan di situs ini.
3. Informasi kontak kamu (nama, email, dan/atau nomor telepon).
4. Pernyataan bahwa kamu memiliki itikad baik bahwa penggunaan konten tersebut tidak diizinkan oleh pemilik hak, agennya, atau hukum yang berlaku.
5. Pernyataan bahwa informasi dalam laporan ini akurat, dan bahwa kamu adalah pemilik hak cipta atau berwenang bertindak atas nama pemilik hak cipta.
6. Tanda tangan fisik atau elektronik dari pemilik hak cipta atau pihak yang berwenang.

Kirimkan laporan melalui halaman Kontak kami.

Kami akan meninjau setiap laporan yang valid dan menghapus atau menonaktifkan akses ke konten yang dilaporkan dalam waktu yang wajar setelah verifikasi.`;

  async function loadStaticContent(){
    const el = document.getElementById('page-content');
    try{
      const { data, error } = await sb.from('site_settings').select('footer_dmca').eq('id', 1).single();
      if(error) throw error;
      const text = data && data.footer_dmca;
      el.textContent = text && text.trim() ? text : DEFAULT_DMCA;
    } catch(err){
      el.innerHTML = errorStateHtml('loadStaticContent');
    }
    setSeo({ title: 'DMCA', description: 'Kebijakan DMCA dan prosedur pengaduan hak cipta Yakultind.' });
  }
  // Search global di header: cegah reload saat Enter ditekan, arahkan ke pencarian index.
  const searchFormEl = document.getElementById('global-search-form');
  const searchInputEl = document.getElementById('global-search-input');
  if(searchFormEl && searchInputEl){
    searchFormEl.addEventListener('submit', (e) => {
      e.preventDefault();
      e.stopImmediatePropagation();
      const q = searchInputEl.value.trim();
      if(q) location.href = 'index.html?search=' + encodeURIComponent(q);
    }, true);
  }

  loadStaticContent();
</script>
</body>
</html>
