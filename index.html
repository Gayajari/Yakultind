<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yakultind — Galeri Foto &amp; Link</title>
<meta name="description" content="Yakultind — kumpulan foto dan link terbaru, ditata rapi dan mudah dicari.">
<meta name="keywords" content="yakultind, galeri foto, kumpulan link, foto dan link">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-top">
    <a href="index.html" class="home-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Home
    </a>
    <a href="index.html" class="logo">Yakult<em>ind</em></a>
    <button type="button" class="icon-round" id="search-toggle" aria-label="Pencarian" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
  </div>
  <div class="search-panel" id="search-panel">
    <form id="global-search-form">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="global-search-input" type="text" placeholder="Pencarian..." autocomplete="off">
    </form>
  </div>
  <div class="bar-slots" id="bar-slots"></div>
</header>

<div class="nav-row" id="nav-row"></div>

<main class="wrap">
  <div class="tabs" id="tabs">
    <button class="tab active" data-sort="baru">Terbaru</button>
    <button class="tab" data-sort="lama">Terlama</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="grid"></div>
  <div class="pagination" id="pagination"></div>
</main>

<div id="site-footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
  let allPosts = [];
  let currentCategory = 'Semua';
  let currentSort = 'baru';
  let currentSearch = '';
  let currentPage = 1;

  function getFilteredList(){
    let list = [...allPosts];
    if(currentCategory !== 'Semua') list = list.filter(p => (p.kategori || 'Umum') === currentCategory);
    if(currentSearch) list = list.filter(p => (p.judul || '').toLowerCase().includes(currentSearch.toLowerCase()));
    list.sort((a,b) => currentSort === 'baru'
      ? new Date(b.dibuat_pada) - new Date(a.dibuat_pada)
      : new Date(a.dibuat_pada) - new Date(b.dibuat_pada));
    return list;
  }

  function cardHtml(p){
    const photos = p.foto_urls || [];
    const cover = photos[0] || '';
    return `
      <article class="card">
        <a class="thumb" href="watch.html?id=${p.id}">
          <span class="cat-tag">${escapeHtml(p.kategori || 'Umum')}</span>
          ${photos.length > 1 ? `<span class="count">${photos.length} foto</span>` : ''}
          <img src="${cover}" alt="${escapeHtml(p.judul)}" loading="lazy">
        </a>
        <div class="card-body">
          <h3><a href="watch.html?id=${p.id}">${escapeHtml(p.judul)}</a></h3>
          <div class="card-footer">
            <div class="card-meta">
              <span class="date">${fmtDate(p.dibuat_pada)}</span>
              ${typeof p.views === 'number' ? `<span class="views">${p.views} dilihat</span>` : ''}
            </div>
            <a class="btn-pill" href="watch.html?id=${p.id}">Lihat</a>
          </div>
        </div>
      </article>`;
  }

  function renderPosts(){
    const grid = document.getElementById('grid');
    const list = getFilteredList();

    if(!list.length){
      grid.innerHTML = '<div class="empty">Belum ada post yang cocok.</div>';
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    const totalPages = Math.max(1, Math.ceil(list.length / POSTS_PER_PAGE));
    if(currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * POSTS_PER_PAGE;
    const pageItems = list.slice(start, start + POSTS_PER_PAGE);

    grid.innerHTML = pageItems.map(cardHtml).join('');
    renderPagination(document.getElementById('pagination'), list.length, currentPage, (p) => {
      currentPage = p;
      renderPosts();
      saveState();
      window.scrollTo({ top: document.getElementById('grid').offsetTop - 80, behavior:'smooth' });
    });
    saveState();
  }

  function renderChips(){
    const cats = ['Semua', ...new Set(allPosts.map(p => p.kategori || 'Umum'))];
    document.getElementById('chips').innerHTML = cats.map(c =>
      `<button class="chip ${c === currentCategory ? 'active':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`
    ).join('');
    document.querySelectorAll('.chip').forEach(btn => btn.addEventListener('click', () => {
      currentCategory = btn.dataset.cat;
      currentPage = 1;
      renderChips(); renderPosts();
    }));
  }

  function saveState(){
    cacheSetState({ category: currentCategory, sort: currentSort, page: currentPage });
  }

  window.onSearchChange = function(q){
    currentSearch = q;
    currentPage = 1;
    renderPosts();
  };

  document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    currentSort = btn.dataset.sort;
    currentPage = 1;
    renderPosts();
  }));

  async function loadPosts(){
    const grid = document.getElementById('grid');
    const cached = cacheGetPosts();
    const state = cacheGetState();
    if(state){
      currentCategory = state.category || 'Semua';
      currentSort = state.sort || 'baru';
      currentPage = state.page || 1;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.sort === currentSort));
    }

    if(cached && cached.posts.length){
      allPosts = cached.posts;
      renderChips();
      renderPosts();
    } else {
      grid.innerHTML = skeletonGridHtml(8);
    }

    try{
      const { data, error } = await sb.from('posts').select('*').order('dibuat_pada', { ascending:false });
      if(error) throw error;
      allPosts = data || [];
      cacheSetPosts(allPosts);
      renderChips();
      renderPosts();
    } catch(err){
      if(!cached || !cached.posts.length){
        grid.innerHTML = errorStateHtml('loadPosts');
        document.getElementById('pagination').innerHTML = '';
      }
      // jika cache tersedia, biarkan data cache tetap tampil meski refresh terbaru gagal
    }
  }
  loadPosts();
</script>
</body>
</html>
