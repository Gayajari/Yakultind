<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Privacy Policy — Yakultind</title>
<meta name="description" content="Kebijakan privasi Yakultind terkait data dan penggunaan situs.">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-top">
    <a href="index.html" class="home-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Home
    </a>
    <a href="index.html" class="logo">Yakult<em>ind</em></a>
    <button type="button" class="icon-round" id="search-toggle" aria-label="Pencarian" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
  </div>
  <div class="search-panel" id="search-panel">
    <form id="global-search-form">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="global-search-input" type="text" placeholder="Pencarian..." autocomplete="off">
    </form>
  </div>
  <div class="bar-slots" id="bar-slots"></div>
</header>

<div class="nav-row" id="nav-row"></div>

<main class="static-page">
  <h1>Privacy Policy</h1>
  <div class="content" id="page-content"><div class="skel-line w1" style="height:15px;"></div><div class="skel-line" style="margin:14px 0;"></div><div class="skel-line w2" style="margin-left:0;"></div></div>
</main>

<div id="site-footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="search-suggest.js"></script>
<script>
  const DEFAULT_PRIVACY = `Kebijakan Privasi ini menjelaskan bagaimana Yakultind mengelola informasi pengunjung.

1. Data yang Dikumpulkan
Kami tidak meminta pendaftaran akun untuk mengakses konten. Data yang mungkin tercatat secara otomatis meliputi log kunjungan standar (seperti alamat IP, jenis perangkat, dan waktu akses) untuk keperluan keamanan dan analitik dasar.

2. Cookie
Situs ini dapat menggunakan cookie sederhana untuk menyimpan preferensi tampilan dan mengurangi penghitungan kunjungan ganda. Cookie ini tidak digunakan untuk melacak identitas pribadi.

3. Data dari Formulir Kontak
Jika kamu menghubungi kami melalui tautan yang tersedia, informasi yang kamu kirimkan hanya digunakan untuk membalas keperluanmu dan tidak dibagikan ke pihak ketiga tanpa izin.

4. Pihak Ketiga
Situs ini dapat menggunakan layanan pihak ketiga (seperti penyedia hosting) yang memiliki kebijakan privasi masing-masing.

5. Perubahan Kebijakan
Kebijakan ini dapat diperbarui sewaktu-waktu. Perubahan akan berlaku sejak dipublikasikan di halaman ini.

Jika ada pertanyaan seputar privasi, silakan hubungi kami melalui halaman Kontak.`;

  async function loadStaticContent(){
    const el = document.getElementById('page-content');
    try{
      const { data, error } = await sb.from('site_settings').select('footer_privacy').eq('id', 1).single();
      if(error) throw error;
      const text = data && data.footer_privacy;
      el.textContent = text && text.trim() ? text : DEFAULT_PRIVACY;
    } catch(err){
      el.innerHTML = errorStateHtml('loadStaticContent');
    }
    setSeo({ title: 'Privacy Policy', description: 'Kebijakan privasi Yakultind terkait data dan penggunaan situs.' });
  }
  // Search global di header: cegah reload saat Enter ditekan, arahkan ke pencarian index.
  const searchFormEl = document.getElementById('global-search-form');
  const searchInputEl = document.getElementById('global-search-input');
  if(searchFormEl && searchInputEl){
    searchFormEl.addEventListener('submit', (e) => {
      e.preventDefault();
      e.stopImmediatePropagation();
      const q = searchInputEl.value.trim();
      if(q) location.href = 'index.html?search=' + encodeURIComponent(q);
    }, true);
  }

  loadStaticContent();
</script>
</body>
</html>
