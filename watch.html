<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memuat… — Yakultind</title>
<meta name="description" content="Detail postingan di Yakultind.">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-top">
    <a href="index.html" class="home-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Home
    </a>
    <a href="index.html" class="logo">Yakult<em>ind</em></a>
    <button type="button" class="icon-round" id="search-toggle" aria-label="Pencarian" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
  </div>
  <div class="search-panel" id="search-panel">
    <form id="global-search-form">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="global-search-input" type="text" placeholder="Pencarian..." autocomplete="off">
    </form>
  </div>
  <div class="bar-slots" id="bar-slots"></div>
</header>

<div class="nav-row" id="nav-row"></div>

<main class="watch-wrap" id="watch-main">
  <div class="skel-thumb" style="border-radius:20px; margin-bottom:22px;"></div>
  <div class="skel-line w1" style="height:16px; margin-left:0;"></div>
  <div class="skel-line" style="margin:14px 0; margin-left:0;"></div>
</main>

<section class="watch-wrap" id="related-wrap" style="display:none;">
  <h2 style="font-family:'Fraunces',serif; font-size:20px; margin:10px 0 16px;">Pencarian Terkait</h2>
  <div id="related-grid" style="display:grid; grid-template-columns:repeat(2, 1fr); gap:14px;"></div>
</section>

<div id="site-footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
  async function loadPost(){
    const id = new URLSearchParams(window.location.search).get('id');
    const main = document.getElementById('watch-main');
    if(!id){
      main.innerHTML = '<div class="empty">Post tidak ditemukan.</div>';
      return;
    }

    let post, error;
    try{
      const res = await sb.from('posts').select('*').eq('id', id).single();
      post = res.data; error = res.error;
    } catch(err){
      error = err;
    }

    if(error){
      main.innerHTML = errorStateHtml('loadPost');
      return;
    }
    if(!post){
      main.innerHTML = '<div class="empty">Post tidak ditemukan atau sudah dihapus.</div>';
      return;
    }

    const photos = post.foto_urls || [];
    setSeo({
      title: post.judul,
      description: `${post.judul} — kategori ${post.kategori || 'Umum'} di Yakultind.`,
      keywords: `${post.judul}, ${post.kategori || ''}, yakultind`,
      image: photos[0] || ''
    });

    main.innerHTML = `
      <div class="watch-gallery">
        ${photos.map((url, i) => `<img src="${url}" alt="${escapeHtml(post.judul)}" loading="${i === 0 ? 'eager' : 'lazy'}" onclick="openLightbox('${url}')">`).join('')}
      </div>
      <span class="watch-cat">${escapeHtml(post.kategori || 'Umum')}</span>
      <h1>${escapeHtml(post.judul)}</h1>
      <div class="watch-meta">
        <span>Dipublikasikan ${fmtDate(post.dibuat_pada)}</span>
      </div>
      <div class="watch-actions">
        <a class="btn-pill" href="${escapeHtml(post.link)}" target="_blank" rel="noopener noreferrer">Buka Link</a>
        ${post.link_download ? `<a class="btn-pill ghost" href="${escapeHtml(post.link_download)}" target="_blank" rel="noopener noreferrer">Unduh</a>` : ''}
      </div>
      <div class="bar-slots watch-link-bar" id="watch-link-bar" style="padding-left:0; padding-right:0;"></div>
    `;

    trackView(id);
    loadWatchLinkBar();
    loadRelated(id);
  }

  /* ---------- View counter dengan cooldown 30 menit per post per browser ---------- */
  const VIEW_COOLDOWN_MS = 30 * 60 * 1000; // 30 menit
  function trackView(id){
    try{
      const key = 'yk_viewed_' + id;
      const last = Number(localStorage.getItem(key) || 0);
      if(Date.now() - last < VIEW_COOLDOWN_MS) return; // masih dalam masa cooldown, jangan hitung lagi
      localStorage.setItem(key, String(Date.now()));
    } catch(e){ /* localStorage diblokir — tetap hitung, lebih baik daripada gagal total */ }
    sb.rpc('increment_views', { post_id: id }).then(() => {}).catch(() => {});
  }

  async function loadRelated(currentId){
    const { data, error } = await sb.from('posts').select('*').neq('id', currentId);
    if(error || !data || !data.length) return;

    // Ambil sebagian besar dari yang paling banyak dibuka
    const byViews = [...data].sort((a,b) => (b.views||0) - (a.views||0));
    const popularCount = Math.min(4, byViews.length);
    const popular = byViews.slice(0, popularCount);

    // Sisipkan beberapa post lain (lama/baru) secara acak, di luar yang sudah kepilih
    const rest = data.filter(p => !popular.find(x => x.id === p.id));
    const shuffled = rest.sort(() => Math.random() - 0.5);
    const extra = shuffled.slice(0, 2);

    const related = [...popular, ...extra].sort(() => Math.random() - 0.5);
    if(!related.length) return;

    document.getElementById('related-wrap').style.display = 'block';
    document.getElementById('related-grid').innerHTML = related.map(p => {
      const cover = (p.foto_urls || [])[0] || '';
      return `
        <a class="card" href="watch.html?id=${p.id}" style="display:block;">
          <div class="thumb"><img src="${cover}" alt="${escapeHtml(p.judul)}" loading="lazy"></div>
          <div class="card-body">
            <h3 style="font-size:15px;">${escapeHtml(p.judul)}</h3>
            <span class="date">${fmtDate(p.dibuat_pada)}</span>
          </div>
        </a>`;
    }).join('');
  }

  loadPost();
</script>
</body>
</html>
