<!DOCTYPE html>
<html lang="id">
<head>

<meta name="description" content="Syarat dan ketentuan penggunaan situs Yakultind.">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-top">
    <a href="index.html" class="home-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Home
    </a>
    <a href="index.html" class="logo">Yakult<em>ind</em></a>
    <button type="button" class="icon-round" id="search-toggle" aria-label="Pencarian" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
  </div>
  <div class="search-panel" id="search-panel">
    <form id="global-search-form">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="global-search-input" type="text" placeholder="Pencarian..." autocomplete="off">
    </form>
  </div>
  <div class="bar-slots" id="bar-slots"></div>
</header>

<div class="nav-row" id="nav-row"></div>

<main class="static-page">
  <h1>Terms</h1>
  <div class="content" id="page-content"><div class="skel-line w1" style="height:15px;"></div><div class="skel-line" style="margin:14px 0;"></div><div class="skel-line w2" style="margin-left:0;"></div></div>
</main>

<div id="site-footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="search-suggest.js"></script>
<script src="home-back.js"></script>
<script>
  const DEFAULT_TERMS = `Dengan mengakses dan menggunakan Yakultind, kamu dianggap menyetujui syarat dan ketentuan berikut.

1. Batasan Usia
Sebagian konten di situs ini ditujukan untuk pengguna dewasa. Dengan mengakses situs ini, kamu menyatakan telah berusia 18 tahun atau lebih, atau usia dewasa yang berlaku di wilayahmu.

2. Penggunaan Konten
Seluruh konten disediakan untuk keperluan informasi dan hiburan pribadi. Dilarang menyalin, menyebarluaskan ulang, atau menggunakan konten situs ini untuk tujuan komersial tanpa izin dari pemilik hak terkait.

3. Perilaku Pengguna
Pengguna dilarang menyalahgunakan situs ini untuk tindakan yang melanggar hukum, termasuk namun tidak terbatas pada penyebaran konten ilegal, pelecehan, atau pelanggaran hak orang lain.

4. Perubahan Layanan
Kami berhak mengubah, menghentikan sementara, atau menghentikan sebagian maupun seluruh layanan tanpa pemberitahuan sebelumnya.

5. Batasan Tanggung Jawab
Situs ini disediakan "sebagaimana adanya". Kami tidak bertanggung jawab atas kerugian yang timbul dari penggunaan situs ini, termasuk gangguan teknis atau konten yang bersumber dari pihak ketiga.

6. Hukum yang Berlaku
Syarat dan ketentuan ini tunduk pada hukum yang berlaku di wilayah tempat situs ini dioperasikan.

Dengan terus menggunakan situs ini, kamu dianggap telah membaca dan menyetujui seluruh ketentuan di atas.`;

  async function loadStaticContent(){
    const el = document.getElementById('page-content');
    try{
      const { data, error } = await sb.from('site_settings').select('footer_terms').eq('id', 1).single();
      if(error) throw error;
      const text = data && data.footer_terms;
      el.textContent = text && text.trim() ? text : DEFAULT_TERMS;
    } catch(err){
      el.innerHTML = errorStateHtml('loadStaticContent');
    }
    setSeo({ title: 'Terms', description: 'Syarat dan ketentuan penggunaan situs Yakultind.' });
  }
  // Search global di header: cegah reload saat Enter ditekan, arahkan ke pencarian index.
  const searchFormEl = document.getElementById('global-search-form');
  const searchInputEl = document.getElementById('global-search-input');
  if(searchFormEl && searchInputEl){
    searchFormEl.addEventListener('submit', (e) => {
      e.preventDefault();
      e.stopImmediatePropagation();
      const q = searchInputEl.value.trim();
      if(q) location.href = 'index.html?search=' + encodeURIComponent(q);
    }, true);
  }

  loadStaticContent();
</script>
</body>
</html>
