<script>
  async function loadStaticContent(){
    const el = document.getElementById('page-content');
    try{
      const { data, error } = await sb.from('site_settings')
        .select('kontak_bar1_nama, kontak_bar1_link, kontak_bar2_nama, kontak_bar2_link, kontak_bar3_nama, kontak_bar3_link')
        .eq('id', 1).single();
      if(error) throw error;

      const slots = [
        { nama: data && data.kontak_bar1_nama, link: data && data.kontak_bar1_link },
        { nama: data && data.kontak_bar2_nama, link: data && data.kontak_bar2_link },
        { nama: data && data.kontak_bar3_nama, link: data && data.kontak_bar3_link }
      ].filter(s => s.nama && s.link);

      el.innerHTML = slots.length
        ? `<div style="display:flex; flex-wrap:wrap; gap:12px;">${slots.map(s =>
            `<a class="btn-pill" href="${escapeHtml(s.link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(s.nama)}</a>`
          ).join('')}</div>`
        : '<div class="empty" style="padding:0;">Kontak belum diatur oleh admin.</div>';
    } catch(err){
      el.innerHTML = errorStateHtml('loadStaticContent');
    }
    setSeo({ title: 'Kontak', description: 'Hubungi Yakultind untuk pertanyaan, kerja sama, atau laporan konten.' });
  }
  // Search global di header: cegah reload saat Enter ditekan, arahkan ke pencarian index.
  const searchFormEl = document.getElementById('global-search-form');
  const searchInputEl = document.getElementById('global-search-input');
  if(searchFormEl && searchInputEl){
    searchFormEl.addEventListener('submit', (e) => {
      e.preventDefault();
      e.stopImmediatePropagation();
      const q = searchInputEl.value.trim();
      if(q) location.href = 'index.html?search=' + encodeURIComponent(q);
    }, true);
  }

  loadStaticContent();
</script>
